<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NUMU - Merchant Dashboard</title>
    <meta name="description" content="NUMU Merchant Dashboard — manage your e-commerce store" />
    <meta name="author" content="NUMU" />

    <link rel="icon" type="image/webp" href="/favicon-512x512.webp" />
    <meta property="og:title" content="NUMU - Merchant Dashboard" />
    <meta property="og:description" content="NUMU Merchant Dashboard — manage your e-commerce store" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/numu-logo-320.webp" as="image" type="image/webp" />

    <!-- Dashboard + brand fonts.
         Dashboard surfaces: IBM Plex Sans Arabic (Arabic body), Inter (Latin body, system fallback OK).
         Brand surfaces (auth, onboarding, marketing-adjacent):
           Reem Kufi — display (Latin + Arabic)
           Tajawal — Arabic body
           Space Grotesk — Latin body
           JetBrains Mono — mono labels (§ eyebrows) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Reem+Kufi:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root">
      <!-- Inline loading screen for instant FCP — replaced by React on mount -->
      <div id="numu-splash" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#fafafa;flex-direction:column;gap:12px">
        <img src="/numu-logo-320.webp" alt="" width="80" height="80" style="border-radius:20px;box-shadow:0 4px 24px rgba(0,0,0,0.08)">
        <div style="width:40px;height:40px;border:3px solid #e5e7eb;border-top-color:#6366f1;border-radius:50%;animation:numu-s 0.7s linear infinite"></div>
        <style>@keyframes numu-s{to{transform:rotate(360deg)}}@media(prefers-color-scheme:dark){#numu-splash{background:#0b1120}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
