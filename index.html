<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NUMU - Merchant Dashboard</title>
    <meta name="description" content="NUMU Merchant Dashboard — manage your e-commerce store" />
    <meta name="author" content="NUMU" />

    <!-- Favicon — same trio the admin backoffice ships, copied from
         numu-admin/client/public so both apps render an identical
         browser-tab mark. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- PWA — the manifest link element is injected at build time by
         vite-plugin-pwa (see vite.config.ts); do NOT add it by hand or it
         will be duplicated. (Written in prose deliberately: a literal tag in
         this comment shows up in `grep rel=manifest dist/index.html` and reads
         like a real duplicate.)

         theme-color tints the BROWSER toolbar while browsing in a tab. It is
         matched to `--background`, which is what `.dash-header` actually sits
         on (#FFFFFF light / #0B1420 dark) and what the inline splash below
         paints — so the browser chrome, splash and app agree with no colour
         jump. The manifest's own theme_color is NUMU navy instead: it colours
         the INSTALLED app's status bar, cannot respond to dark mode, and navy
         reads as deliberate brand against both backgrounds where a flat white
         would look broken in dark mode. -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1420" media="(prefers-color-scheme: dark)" />
    <!-- iOS standalone: opt into full-screen chrome and match the status bar
         to the app background. `black-translucent` lets content run under the
         status bar, which works because the viewport is already
         `viewport-fit=cover` and `.safe-bottom`/`.safe-top` handle the insets. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NUMU" />

    <meta property="og:title" content="NUMU - Merchant Dashboard" />
    <meta property="og:description" content="NUMU Merchant Dashboard — manage your e-commerce store" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <!-- The splash mark below is drawn with `mask-image`, and an element
         whose mask has not loaded yet paints UNMASKED — a saffron rectangle
         for a frame or two on first visit. Preloading it is what keeps the
         very first paint the letterform. (This slot used to preload
         `numu-n-mark.jpg` for the old ring splash; that asset is still used
         by the dashboard hero card, but it is no longer first paint.) -->
    <link rel="preload" href="/numu-mark-mask.webp" as="image" type="image/webp" />

    <!-- Theme bootstrap — MUST run before first paint. next-themes owns
         `localStorage.theme` ("light" | "dark" | "system") and the `.dark`
         class once React mounts, but in a Vite SPA it can only do that
         after the bundle loads; without this the dark-mode dashboard
         flashed white on every load. Same resolution rules as next-themes
         with enableSystem: explicit value wins, else the OS scheme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark =
            t === "dark" ||
            ((!t || t === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (dark) {
            root.classList.add("dark");
            root.style.colorScheme = "dark";
          } else {
            root.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>

    <!-- Dashboard + brand fonts.
         Dashboard surfaces: IBM Plex Sans Arabic (Arabic body), Inter (Latin body, system fallback OK).
         Brand surfaces (auth, onboarding, marketing-adjacent):
           Reem Kufi — display (Latin + Arabic)
           Tajawal — Arabic body
           Space Grotesk — Latin body
           JetBrains Mono — mono labels (§ eyebrows) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Cairo:wght@300;400;500;600;700;800;900&family=Reem+Kufi:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root">
      <!-- Inline loading screen — matches NHUB UI kit Loader exactly:
           N-mark tile breathing in place, encircled by a saffron arc
           spinner on a warm cream track. Replaced by React on mount. -->
      <div id="numu-splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#FFFFFF;z-index:200">
        <div style="position:relative;width:104px;height:104px;display:grid;place-items:center">
          <div id="numu-splash-mark"></div>
        </div>
        <style>
          /* The N is applied as a MASK, so the div's own background is what
             gets clipped to the letterform — that is what lets the saffron
             fill climb through the mark. Duplicated from `.numu-mark` in
             src/index.css because this paints before the CSS bundle loads;
             the React BrandLoader must stay identical or the splash-to-app
             handoff jumps. 496:528 is the asset's aspect ratio. */
          #numu-splash-mark {
            width: 69px;
            height: 73px;
            -webkit-mask-image: url("/numu-mark-mask.webp");
            mask-image: url("/numu-mark-mask.webp");
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            background-image: linear-gradient(to top, #E89A2C 50%, #DDD6C8 50%);
            background-size: 100% 200%;
            animation: numu-mark-rise 1.6s cubic-bezier(.4, 0, .2, 1) infinite;
          }
          @keyframes numu-mark-rise {
            0%   { background-position: 0 0%; }
            62%  { background-position: 0 100%; }
            100% { background-position: 0 100%; }
          }
          /* Follows the `.dark` class the bootstrap script above sets from
             the STORED theme (falling back to the OS scheme) — not the raw
             media query — so a merchant who chose dark on a light OS, or
             vice-versa, gets a splash that matches the app that follows. */
          .dark #numu-splash { background: #0B1420 }
          .dark #numu-splash-mark {
            background-image: linear-gradient(to top, #E89A2C 50%, #25344A 50%);
          }
          @media (prefers-reduced-motion: reduce) {
            #numu-splash-mark {
              animation: none;
              background-image: none;
              background-color: #E89A2C;
              opacity: .75;
            }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
