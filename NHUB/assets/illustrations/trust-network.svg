<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" fill="none" role="img" aria-label="NUMU Trust Network">
  <defs>
    <linearGradient id="tn-grad-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04BEBE"></stop>
      <stop offset="1" stop-color="#6BE3E3"></stop>
    </linearGradient>
    <linearGradient id="tn-grad-shield" x1="0" y1="0" x2="0" y2="1">
