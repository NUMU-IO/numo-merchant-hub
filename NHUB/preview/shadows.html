<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .e { width: 116px; height: 70px; border-radius: 16px; background: var(--surface); display:flex; align-items:flex-end; justify-content:center; padding-bottom:7px; border: 1px solid var(--border); }
  .e span { font-size: 10px; font-family: var(--font-mono); color: var(--ink-soft); }
  .navy { background: var(--navy); color:#fff; box-shadow: var(--depth-navy); }
  .navy span { color: rgba(255,255,255,.7); }
</style></head>
<body>
  <div class="row" style="gap:18px; padding:8px 4px">
    <div class="col" style="gap:7px;align-items:center"><div class="e" style="box-shadow:var(--shadow-sm)"><span>sm</span></div><div class="label">controls</div></div>
    <div class="col" style="gap:7px;align-items:center"><div class="e" style="box-shadow:var(--shadow-card)"><span>card</span></div><div class="label">surfaces</div></div>
    <div class="col" style="gap:7px;align-items:center"><div class="e" style="box-shadow:var(--shadow-lg)"><span>lg</span></div><div class="label">hover-lift</div></div>
    <div class="col" style="gap:7px;align-items:center"><div class="e navy"><span>key</span></div><div class="label">button depth</div></div>
  </div>
  <div class="label" style="margin-top:6px; padding:0 4px">Warm navy-tinted shadows. Buttons get a tactile 2px "key" depth that presses down on click.</div>
</body></html>
