<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<style>
  .field { display:flex; flex-direction:column; gap:6px; }
  label { font-size:13px; font-weight:700; }
  .input { height:46px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface); padding:0 16px; font-size:14.5px; font-family:inherit; color:var(--ink); }
  .input::placeholder { color:var(--ink-faint); }
  .focus { border-color:var(--navy); box-shadow:0 0 0 4px color-mix(in srgb,var(--navy) 14%,transparent); }
  .search { display:flex; align-items:center; gap:9px; height:42px; border-radius:14px; border:1px solid var(--border); background:var(--surface); padding:0 16px; color:var(--ink-soft); font-size:14px; }
  .search .iconify { font-size:19px; }
  kbd { margin-inline-start:auto; border:1px solid var(--border); border-radius:7px; background:var(--surface-2); font-family:var(--font-mono); font-size:11px; padding:2px 6px; }
</style></head>
<body>
  <div class="col" style="gap:14px; max-width:360px">
    <div class="field"><label>Product name</label><input class="input" placeholder="Egyptian Cotton T-Shirt"></div>
    <div class="field"><label>Price (focused)</label><input class="input focus" value="349"></div>
    <div class="search"><span class="iconify" data-icon="ph:magnifying-glass-bold"></span>Search products, orders…<kbd>⌘K</kbd></div>
  </div>
</body></html>
