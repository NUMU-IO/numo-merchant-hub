<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .box { width: 90px; height: 64px; background: var(--surface-2); border: 1px solid var(--border-strong); display:flex; align-items:flex-end; justify-content:center; padding-bottom:5px; }
  .box span { font-size: 10px; font-family: var(--font-mono); color: var(--ink-soft); }
</style></head>
<body>
  <div class="row" style="gap:12px">
    <div class="col" style="gap:5px;align-items:center"><div class="box" style="border-radius:8px"><span>8</span></div><div class="label">xs</div></div>
    <div class="col" style="gap:5px;align-items:center"><div class="box" style="border-radius:12px"><span>12</span></div><div class="label">sm</div></div>
    <div class="col" style="gap:5px;align-items:center"><div class="box" style="border-radius:16px"><span>16</span></div><div class="label">base</div></div>
    <div class="col" style="gap:5px;align-items:center"><div class="box" style="border-radius:20px"><span>20</span></div><div class="label">lg · cards</div></div>
    <div class="col" style="gap:5px;align-items:center"><div class="box" style="border-radius:26px"><span>26</span></div><div class="label">xl · panels</div></div>
    <div class="col" style="gap:5px;align-items:center"><div class="box" style="border-radius:999px"><span>full</span></div><div class="label">pills</div></div>
  </div>
  <div class="label" style="margin-top:14px">Chunky &amp; tactile. Base <span class="mono">16px</span>, cards <span class="mono">20px</span>, buttons <span class="mono">14px</span>, chips &amp; pills full.</div>
</body></html>
