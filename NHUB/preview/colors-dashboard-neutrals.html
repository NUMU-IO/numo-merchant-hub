<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
  <div class="row" style="gap:12px; align-items:stretch">
    <div class="swatch"><div class="sw" style="background:var(--bg);border:1px solid var(--border)"></div><div class="name">Ground (white)</div><div class="hex">#FFFFFF</div></div>
    <div class="swatch"><div class="sw" style="background:var(--surface); box-shadow:var(--shadow-card)"></div><div class="name">Card</div><div class="hex">#FFFFFF + shadow</div></div>
    <div class="swatch"><div class="sw" style="background:var(--surface-2)"></div><div class="name">Warm inset</div><div class="hex">#F5F2EB</div></div>
    <div class="swatch"><div class="sw" style="background:var(--border)"></div><div class="name">Hairline</div><div class="hex">#E4D8C3</div></div>
    <div class="swatch"><div class="sw" style="background:var(--ink-soft)"></div><div class="name">Soft ink</div><div class="hex">#5B6A7E</div></div>
    <div class="swatch"><div class="sw" style="background:var(--ink)"></div><div class="name">Ink</div><div class="hex">#14253D</div></div>
  </div>
  <div class="label" style="margin-top:14px">Clean <strong>white</strong> app ground &amp; cards (separated by hairline + soft shadow); warmth kept as subtle insets + saffron/navy accents.</div>
</body></html>
