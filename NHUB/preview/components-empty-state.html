<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<style>
  .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:22px; }
  .ico { width:62px; height:62px; border-radius:20px; background:var(--surface-2); display:grid; place-items:center; margin-bottom:16px; color:var(--navy); }
  .ico .iconify { font-size:30px; }
  h3 { font-family:var(--font-display); font-size:18px; font-weight:700; margin:0 0 6px; }
  p { font-size:14.5px; color:var(--ink-soft); max-width:360px; margin:0 0 18px; line-height:1.55; }
  .btn { display:inline-flex; align-items:center; gap:9px; height:46px; padding:0 22px; border-radius:14px; background:var(--navy); color:#fff; font-size:14.5px; font-weight:700; border:none; box-shadow:var(--depth-navy); }
  .btn .iconify { font-size:19px; }
</style></head>
<body>
  <div class="empty">
    <div class="ico"><span class="iconify" data-icon="ph:package-duotone"></span></div>
    <h3>No drafts yet</h3>
    <p>Start a new draft to save an in-progress order for later — customers don't see drafts until you convert them.</p>
    <button class="btn"><span class="iconify" data-icon="ph:plus-bold"></span>New draft</button>
  </div>
</body></html>
