<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<style>
  .kpi { background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow-card); padding:18px; width:212px; }
  .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .ichip { width:40px; height:40px; border-radius:13px; display:grid; place-items:center; }
  .ichip .iconify { font-size:21px; }
  .navy { background:var(--navy); color:var(--saffron); }
  .sage { background:#E3EEE2; color:var(--sage); }
  .delta { font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; }
  .val { font-family:var(--font-display); font-size:27px; font-weight:800; letter-spacing:-.02em; margin-top:2px; margin-bottom:10px; font-variant-numeric:tabular-nums; }
  .lbl { font-size:13px; font-weight:600; color:var(--ink-soft); }
</style></head>
<body>
  <div class="row" style="gap:14px">
    <div class="kpi">
      <div class="top"><div class="ichip navy"><span class="iconify" data-icon="ph:trend-up-duotone"></span></div><span class="delta" style="color:var(--success);background:var(--success-bg)">+12.4%</span></div>
      <div class="lbl">Sales</div>
      <div class="val">EGP 48,250</div>
      <svg width="100%" height="40" viewBox="0 0 200 40" preserveAspectRatio="none">
        <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0C2D54" stop-opacity=".22"/><stop offset="100%" stop-color="#0C2D54" stop-opacity="0"/></linearGradient></defs>
        <path d="M0,30 C30,28 50,18 80,20 C110,22 130,8 160,12 C180,14 195,6 200,8 L200,40 L0,40 Z" fill="url(#g)"/>
        <path d="M0,30 C30,28 50,18 80,20 C110,22 130,8 160,12 C180,14 195,6 200,8" fill="none" stroke="#0C2D54" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="kpi">
      <div class="top"><div class="ichip sage"><span class="iconify" data-icon="ph:users-duotone"></span></div><span class="delta" style="color:var(--success);background:var(--success-bg)">+3.2%</span></div>
      <div class="lbl">Visitors</div>
      <div class="val">5,840</div>
      <svg width="100%" height="40" viewBox="0 0 200 40" preserveAspectRatio="none">
        <defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5E8A5C" stop-opacity=".22"/><stop offset="100%" stop-color="#5E8A5C" stop-opacity="0"/></linearGradient></defs>
        <path d="M0,32 C30,30 50,26 80,22 C110,18 130,20 160,14 C180,11 195,9 200,7 L200,40 L0,40 Z" fill="url(#g2)"/>
        <path d="M0,32 C30,30 50,26 80,22 C110,18 130,20 160,14 C180,11 195,9 200,7" fill="none" stroke="#5E8A5C" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
</body></html>
