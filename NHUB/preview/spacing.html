<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .bar { height: 16px; background: color-mix(in srgb, var(--navy) 22%, transparent); border-radius: 5px; }
  .unit { display:flex; align-items:center; gap:10px; }
  .unit .v { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); width: 64px; }
</style></head>
<body>
  <div class="col" style="gap:9px">
    <div class="unit"><div class="v">8</div><div class="bar" style="width:8px"></div></div>
    <div class="unit"><div class="v">12</div><div class="bar" style="width:12px"></div></div>
    <div class="unit"><div class="v">14</div><div class="bar" style="width:14px"></div></div>
    <div class="unit"><div class="v">18</div><div class="bar" style="width:18px"></div></div>
    <div class="unit"><div class="v">24 · page</div><div class="bar" style="width:24px"></div></div>
    <div class="unit"><div class="v">44 · tap</div><div class="bar" style="width:44px;background:color-mix(in srgb,var(--saffron) 40%,transparent)"></div></div>
  </div>
  <div class="label" style="margin-top:13px">Generous, mobile-first. Page padding <span class="mono">24</span>, card <span class="mono">18–20</span>, gaps 14. Touch targets ≥ <span class="mono">44px</span>; bottom-nav 76px.</div>
</body></html>
