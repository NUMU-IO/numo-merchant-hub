<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .tile { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .tile .cap { font-size:10px; color:var(--ink-soft); font-family:var(--font-mono); }
  .onnavy { background:#0C2D54; padding:14px; border-radius:14px; }
  .oncream { background:#F4EDE0; padding:14px; border-radius:14px; }
</style></head>
<body>
  <div class="row" style="gap:20px; align-items:flex-end">
    <div class="tile"><img src="../assets/numu-logo-320.webp" style="height:64px;border-radius:14px"><div class="cap">app icon</div></div>
    <div class="tile"><div class="oncream"><img src="../assets/numu-symbol-navy-transparent.webp" style="height:44px"></div><div class="cap">mark · navy</div></div>
    <div class="tile"><div class="onnavy"><img src="../assets/numu-symbol-white-transparent.webp" style="height:44px"></div><div class="cap">mark · white</div></div>
    <div class="tile"><div style="font-family:var(--font-brand);font-size:34px;font-weight:600;color:#0C2D54;line-height:1">numu</div><div class="cap">wordmark · latin</div></div>
    <div class="tile"><div style="font-family:var(--font-brand);font-size:34px;font-weight:700;color:#0C2D54;line-height:1">نُمُو</div><div class="cap">wordmark · arabic</div></div>
  </div>
</body></html>
