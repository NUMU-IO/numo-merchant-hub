<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 20px 22px; }
  .line { display: flex; align-items: baseline; gap: 14px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .line:last-child { border-bottom: none; }
  .t { flex: 1; min-width: 0; font-family: var(--font-display); }
  .px { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-soft); width: 128px; text-align: end; flex-shrink: 0; }
</style></head>
<body>
  <div class="col" style="gap:0">
    <div class="line"><div class="t" style="font-size:32px;font-weight:800;letter-spacing:-.02em">Display</div><div class="px">32 / 800</div></div>
    <div class="line"><div class="t" style="font-size:24px;font-weight:800;letter-spacing:-.01em">Page title</div><div class="px">24 / 800</div></div>
    <div class="line"><div class="t tnum" style="font-size:27px;font-weight:800">EGP 48,250</div><div class="px">27 / 800 KPI</div></div>
    <div class="line"><div class="t" style="font-size:19px;font-weight:700">Card / section title</div><div class="px">19 / 700</div></div>
    <div class="line"><div class="t" style="font-size:15px;font-weight:400;font-family:var(--font-ui)">Body text</div><div class="px">15 / 400</div></div>
    <div class="line"><div class="t" style="font-size:13px;font-weight:600;font-family:var(--font-ui)">Secondary · nav</div><div class="px">13 / 600</div></div>
    <div class="line"><div class="t" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-family:var(--font-ui)">Micro label</div><div class="px">11 / 700 caps</div></div>
  </div>
</body></html>
