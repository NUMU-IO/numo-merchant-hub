<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <!-- NUMU N monogram — Souq brand. Deep navy ground with a chunky
       cream interlocking N + saffron star corner accents. Matches the
       /numu-n-mark.jpg used in the sidebar header. -->
  <rect width="160" height="160" rx="36" fill="#0C2D54" />

  <!-- Corner stars (subtle saffron sparkle accents) -->
  <g fill="#E89A2C" opacity="0.85">
    <path d="M22 22 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 z" />
    <path d="M138 22 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 z" opacity="0.6" />
    <path d="M22 138 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 z" opacity="0.6" />
    <path d="M138 138 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 z" />
  </g>

  <!-- The N — two chunky cream verticals + a thick diagonal cross.
       Cream is #F4EDE0 to read warm against navy. -->
  <g fill="#F4EDE0">
    <!-- Left vertical -->
    <rect x="42" y="42" width="18" height="76" rx="3" />
    <!-- Right vertical -->
    <rect x="100" y="42" width="18" height="76" rx="3" />
    <!-- Diagonal: drawn as a parallelogram from top-left to bottom-right -->
    <path d="M55 42 L73 42 L118 118 L100 118 Z" />
  </g>
</svg>
