name: CI

on:
  push:
    branches: [dev, stage, prod]
  pull_request:
    branches: [dev, stage, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: /api/v1
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      # PWA guards. Both failure modes below are SILENT — they pass every
      # functional test — so they are enforced here rather than reviewed.
      #   1. Precache bloat: a broad glob precaches all ~343 route chunks
      #      (4.9 MB) instead of the ~1.2 MB shell. Merchants pay that on
      #      install, over Egyptian mobile data.
      #   2. A cache rule matching /api/: a cross-tenant data leak, because the
      #      Cache API keys by URL and ignores the X-Tenant-Id header.
      - name: PWA precache budget + /api/ deny-rule guard
        run: node scripts/check-precache.mjs

      # The Vercel catch-all rewrite turns a MISSING file into a 200 text/html
      # instead of a 404. If sw.js ever fails to emit, registration fails with a
      # confusing "unsupported MIME type" rather than an honest error — so we
      # assert the served content type, not just the file's existence.
      - name: Service worker is served as JavaScript
        run: |
          npm run preview -- --port 4173 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:4173/" && break
            sleep 1
          done
          CT=$(curl -sI "http://127.0.0.1:4173/sw.js" | tr -d '\r' | grep -i '^content-type:' | cut -d' ' -f2-)
          echo "sw.js content-type: $CT"
          case "$CT" in
            *javascript*) echo "OK" ;;
            *) echo "::error::sw.js served as '$CT', expected a JavaScript type"; exit 1 ;;
          esac

      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
