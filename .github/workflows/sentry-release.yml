name: Sentry Release

# Release name = the full commit SHA, the value vite.config.ts bakes into the
# bundle from Vercel's VERCEL_GIT_COMMIT_SHA. Source maps are NOT uploaded
# here: a separate CI build never matches the bundle Vercel serves, so they
# have to come from the Vercel build itself.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev, stage, prod]

concurrency:
  group: sentry-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    name: Create Sentry Release & Deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Map branch to Sentry environment
        id: env
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          case "$BRANCH" in
            dev)   ENVIRONMENT="development" ;;
            stage) ENVIRONMENT="staging" ;;
            prod)  ENVIRONMENT="production" ;;
            *)     echo "::error::Unknown branch: $BRANCH" && exit 1 ;;
          esac
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: Create Sentry release & record deploy
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: ${{ steps.env.outputs.environment }}
          version: ${{ github.event.workflow_run.head_sha }}
          finalize: true
