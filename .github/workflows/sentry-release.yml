name: Sentry Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev, stage, prod]

concurrency:
  group: sentry-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  release:
    name: Create Sentry Release & Deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Map branch to Sentry environment
        id: env
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          case "$BRANCH" in
            dev)   ENVIRONMENT="development" ;;
            stage) ENVIRONMENT="staging" ;;
            prod)  ENVIRONMENT="production" ;;
            *)     echo "::error::Unknown branch: $BRANCH" && exit 1 ;;
          esac
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "version=numo-merchant-hub@${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build with hidden source maps
        run: npx vite build --sourcemap hidden

      - name: Create Sentry release, upload source maps & record deploy
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: ${{ steps.env.outputs.environment }}
          version: ${{ steps.env.outputs.version }}
          sourcemaps: ./dist
          finalize: true
