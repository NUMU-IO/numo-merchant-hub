name: Mirror prod to deploy fork

# Keeps Yahiasherif002/numo-merchant-hub:prod in lock-step with NUMU-IO:prod.
# Vercel deploys the merchant hub from that fork (org forking disabled), so
# every push to NUMU-IO prod is force-mirrored to the fork -> Vercel deploys.
on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    # Only run on the upstream repo. The fork inherits this file when mirrored,
    # but must never run it (would push to itself).
    if: github.repository == 'NUMU-IO/numo-merchant-hub'
    runs-on: ubuntu-latest
    env:
      HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod
          fetch-depth: 0
          # Don't persist GITHUB_TOKEN as a git auth header — it would override
          # the MIRROR_PAT in the push URL and fail (no fork access).
          persist-credentials: false
      - name: Force-mirror prod -> fork (prod AND main)
        # BOTH branches: the Vercel project's production branch is `main`
        # on the fork, so mirroring only `prod` made every Promote look
        # successful while Vercel kept building stale `main` (live
        # incident 2026-08-02 — hub "deployed" with nothing changing).
        run: |
          git push --force \
            "https://x-access-token:${{ secrets.MIRROR_PAT }}@github.com/Yahiasherif002/numo-merchant-hub.git" \
            HEAD:prod HEAD:main
      # Vercel's GitHub webhook has silently dropped push events before
      # (2026-07-16: mirror succeeded, no deployment was created). The deploy
      # hook makes the production build deterministic instead of hoping the
      # push event arrives.
      - name: Trigger Vercel production build
        if: ${{ env.HOOK != '' }}
        run: curl -sf -X POST "$HOOK"
