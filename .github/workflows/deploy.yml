name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev, stage, prod]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  DEPLOY_HOST: 188.166.156.151
  DEPLOY_USER: root

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Map the source branch → target environment.
      # dev   → /opt/numu/merchant-hub-test    (merchant-test.numueg.app)
      # stage → /opt/numu/merchant-hub-stage   (merchant-staging.numueg.app)
      # prod  → /opt/numu/merchant-hub         (merchant.numueg.app, apex)
      #
      # Storefront URLs are flat (level-1) on all envs because Cloudflare
      # Universal SSL only covers `*.numueg.app`. Store subdomains carry
      # the env suffix (e.g. `dev-shop-test`) which is appended on the
      # frontend at create time (see src/lib/env.ts withEnvSuffix).
      # So the URL template `https://{subdomain}.numueg.app` works for
      # all envs — VITE_STOREFRONT_URL is the same everywhere.
      - name: Resolve deploy target for ${{ github.event.workflow_run.head_branch }}
        id: target
        run: |
          case "${{ github.event.workflow_run.head_branch }}" in
            dev)
              echo "remote_path=/opt/numu/merchant-hub-test/" >> "$GITHUB_OUTPUT"
              echo "sentry_env=test" >> "$GITHUB_OUTPUT"
              # V3 BYOT storefront (parallel host) — only deployed on test.
              echo "v3_storefront_url=https://{subdomain}.v3.test.numueg.app" >> "$GITHUB_OUTPUT"
              ;;
            stage)
              echo "remote_path=/opt/numu/merchant-hub-stage/" >> "$GITHUB_OUTPUT"
              echo "sentry_env=staging" >> "$GITHUB_OUTPUT"
              # V3 storefront not deployed on stage yet → empty (falls back).
              echo "v3_storefront_url=" >> "$GITHUB_OUTPUT"
              ;;
            prod)
              echo "remote_path=/opt/numu/merchant-hub/" >> "$GITHUB_OUTPUT"
              echo "sentry_env=production" >> "$GITHUB_OUTPUT"
              # V3 storefront not deployed on prod yet → empty (falls back).
              echo "v3_storefront_url=" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported branch ${{ github.event.workflow_run.head_branch }}"
              exit 1
              ;;
          esac

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: /api/v1
          VITE_STOREFRONT_URL: https://{subdomain}.numueg.app
          # Used only for previewing V3 (BYOT) marketplace themes; empty on
          # envs without a V3 storefront (preview falls back to the default).
          VITE_V3_STOREFRONT_URL: ${{ steps.target.outputs.v3_storefront_url }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ steps.target.outputs.sentry_env }}

      - name: Deploy to server via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: dist/
          remote_path: ${{ steps.target.outputs.remote_path }}
          remote_host: ${{ env.DEPLOY_HOST }}
          remote_user: ${{ env.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker exec numu-nginx-staging nginx -s reload
            echo "Merchant hub deployed (branch=${{ github.event.workflow_run.head_branch }}) → ${{ steps.target.outputs.remote_path }}"
