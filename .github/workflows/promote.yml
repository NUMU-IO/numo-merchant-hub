name: Promote

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Promote to which environment?"
        required: true
        type: choice
        options:
          - stage   # dev → stage (triggers stage deploy)
          - prod    # stage → prod (triggers prod deploy)
          - all     # dev → stage → prod (one-click full promotion)

concurrency:
  group: promote-merchant-hub-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  promote:
    name: Promote (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Promote dev → stage
        if: github.event.inputs.environment == 'stage' || github.event.inputs.environment == 'all'
        run: |
          git fetch origin dev stage
          git checkout stage
          git merge --ff-only origin/dev
          git push origin stage

      - name: Promote stage → prod
        if: github.event.inputs.environment == 'prod' || github.event.inputs.environment == 'all'
        run: |
          git fetch origin stage prod
          git checkout prod
          git merge --ff-only origin/stage
          git push origin prod

      - name: Summary
        run: |
          TARGET="${{ github.event.inputs.environment }}"
          case "$TARGET" in
            stage) echo "### Promoted dev → stage" >> $GITHUB_STEP_SUMMARY ;;
            prod)  echo "### Promoted stage → prod" >> $GITHUB_STEP_SUMMARY ;;
            all)   echo "### Promoted dev → stage → prod" >> $GITHUB_STEP_SUMMARY ;;
          esac
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Merchant Hub branch(es) updated." >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`$(git rev-parse --short HEAD)\`" >> $GITHUB_STEP_SUMMARY
