name: Promote

# Promote dev → prod in one click. Staging is intentionally bypassed.
# Pushing `prod` triggers mirror-to-fork.yml → Vercel deploys the hub.
on:
  workflow_dispatch:

concurrency:
  group: promote-merchant-hub
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  promote:
    name: dev → prod
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: write
      actions: write # dispatch mirror-to-fork.yml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin dev prod

      - name: Promote dev → prod
        run: |
          echo "==> Promoting prod ← dev"
          git checkout prod
          # Fast-forward when prod is an ancestor of dev (the common case);
          # fall back to a real merge if prod diverged so promote never wedges.
          git merge --ff-only origin/dev \
            || git merge --no-edit -m "Promote dev → prod" origin/dev
          git push origin prod

      # A push made with GITHUB_TOKEN (GH_PAT unset/expired fallback) does NOT
      # trigger other workflows, so mirror-to-fork.yml's push trigger would
      # silently never fire. Dispatch it explicitly so the mirror always runs.
      - name: Trigger mirror-to-fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run mirror-to-fork.yml --ref prod

      - name: Summary
        run: |
          echo "### Promoted dev → prod" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Mirror-to-fork → Vercel will deploy. Commit: \`$(git rev-parse --short HEAD)\`" >> $GITHUB_STEP_SUMMARY
