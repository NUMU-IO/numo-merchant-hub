name: Promote

# Promote dev → prod in one click. Staging is intentionally bypassed.
# Only a dev commit whose CI run passed (lint, type-check ratchet, tests,
# build) is promoted. Pushing `prod` runs CI there, and mirror-to-fork.yml
# deploys the hub once that run is green.
on:
  workflow_dispatch:

concurrency:
  group: promote-merchant-hub
  cancel-in-progress: false

jobs:
  promote:
    name: dev → prod
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read # look up the CI run for the dev commit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin dev prod

      # Merge this exact SHA rather than origin/dev, so a push landing on dev
      # mid-run cannot slip an untested commit into prod.
      - name: Require green CI for the dev commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse origin/dev)
          PASSED=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --status success --json databaseId --jq length)
          if [ "$PASSED" = "0" ]; then
            echo "::error::CI has not passed for dev@${SHA:0:7} (running, failed or cancelled). Promote once it is green."
            exit 1
          fi
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Promote dev → prod
        run: |
          echo "==> Promoting prod ← dev@${SHA:0:7}"
          git checkout prod
          # Fast-forward when prod is an ancestor of dev (the common case);
          # fall back to a real merge if prod diverged so promote never wedges.
          git merge --ff-only "$SHA" \
            || git merge --no-edit -m "Promote dev → prod" "$SHA"
          git push origin prod

      # No mirror dispatch here: mirror-to-fork.yml runs when CI passes on the
      # pushed prod commit (a merge commit is new, so it is tested there first).
      - name: Summary
        run: |
          echo "### Promoted dev → prod" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Vercel deploys once CI passes on prod. Commit: \`$(git rev-parse --short HEAD)\`" >> $GITHUB_STEP_SUMMARY
